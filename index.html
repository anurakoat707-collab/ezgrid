<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="EZGrid">
<title>EZGrid - ตารางคิดเลข</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0b1220;--card:#131c30;--card2:#18233b;--line:#24324f;--tx:#e8eef8;--mute:#8a9bbb;--pri:#3b82f6;--pri2:#60a5fa;--ok:#22c55e;--bad:#f87171;--input:#0d1526;--hd:#101a2e}
@media (prefers-color-scheme: light){:root{--bg:#eef2f8;--card:#fff;--card2:#f1f5f9;--line:#dde4ee;--tx:#0f172a;--mute:#64748b;--input:#fff;--pri2:#2563eb;--hd:#f5f7fb;--ok:#16a34a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI","Noto Sans Thai",sans-serif}
button,input{font:inherit;color:inherit}
#wrap{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(120px + env(safe-area-inset-bottom))}
svg{width:22px;height:22px;flex:none}

header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--bg);border-bottom:1px solid var(--line)}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#2563eb,#38bdf8);display:grid;place-items:center;flex:none}
.logo svg{width:20px;height:20px}
#listBtn{flex:1;min-width:0;border:0;background:none;text-align:left;padding:0;cursor:pointer;line-height:1.2}
#listBtn b{display:block;font-size:17px}
#listBtn span{display:block;color:var(--pri2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{border:1px solid var(--line);background:var(--card);width:42px;height:42px;border-radius:12px;display:grid;place-items:center;cursor:pointer;flex:none}

main{padding:12px 0}
.hint{color:var(--mute);font-size:13px;margin:0 14px 10px}
#tw{overflow-x:auto;margin:0 8px;border:1px solid var(--line);border-radius:16px;background:var(--card);overscroll-behavior-x:contain}
table{border-collapse:separate;border-spacing:0;min-width:100%}
th,td{border-bottom:1px solid var(--line);padding:0;white-space:nowrap;background:var(--card)}
thead th{background:var(--hd);color:var(--mute);font-size:12.5px;font-weight:600;height:30px;text-align:center}
tbody tr:last-child td{border-bottom:0}
.rn{position:sticky;left:0;z-index:2;width:30px;min-width:30px;text-align:center;color:var(--mute);font-size:13px;cursor:pointer}
.opc{position:sticky;left:30px;z-index:2;width:46px;min-width:46px;text-align:center;border-right:1px solid var(--line)}
.opb{width:38px;height:38px;border-radius:10px;border:0;background:var(--pri);color:#fff;font-size:22px;font-weight:700;cursor:pointer;padding:0;line-height:1}
.cl{padding:5px 3px;min-width:66px}
.cl input{width:64px;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--input);text-align:center;font-size:18px;font-weight:600;outline:none;padding:0 2px}
.cl input:focus{border-color:var(--pri2);box-shadow:0 0 0 3px rgba(59,130,246,.25)}
.cl input::placeholder{color:var(--line)}
.rc{position:sticky;right:44px;z-index:2;min-width:88px;max-width:130px;padding:0 8px;text-align:right;border-left:1px solid var(--line);font-weight:700;color:var(--ok);font-size:17px;overflow:hidden;text-overflow:ellipsis}
.rc.long{font-size:13.5px}.rc.empty{color:var(--mute);font-weight:400}.rc.err{color:var(--bad);font-size:12px;white-space:normal;line-height:1.15}
.pc{position:sticky;right:0;z-index:2;width:44px;min-width:44px;text-align:center}
.ph{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card2);display:inline-grid;place-items:center;cursor:pointer;padding:0;overflow:hidden;color:var(--mute);vertical-align:middle}
.ph.has{border-color:var(--pri2)}
.ph img{width:100%;height:100%;object-fit:cover}
.ph svg{width:19px;height:19px}

.total{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;z-index:6;background:var(--card);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:8px;box-shadow:0 -8px 24px rgba(0,0,0,.25)}
.total div{flex:1;min-width:0}
.total small{display:block;color:var(--mute);font-size:13px}
.total b{display:block;font-size:28px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.total button{flex:none;height:48px;padding:0 12px;border:1px solid var(--line);border-radius:14px;background:var(--card2);font-weight:700;font-size:15px;cursor:pointer}
.total button.pri{background:var(--pri);border-color:var(--pri);color:#fff}

#bd{position:fixed;inset:0;background:rgba(2,6,23,.55);opacity:0;pointer-events:none;transition:.2s;z-index:20}
#bd.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;background:var(--card);border-radius:22px 22px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom));transform:translate(-50%,110%);transition:transform .22s;z-index:21}
#sheet.on{transform:translate(-50%,0)}
#sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
#sheet h3{margin:0 0 12px;font-size:18px}
.mi{display:flex;align-items:center;gap:12px;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:15px 4px;font-size:16.5px;cursor:pointer;text-align:left}
.mi:last-child{border-bottom:0}
.mi.bad{color:var(--bad)}.mi.on{color:var(--pri2);font-weight:700}
.mi small{margin-left:auto;color:var(--mute)}
.btns{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;height:50px;border:0;border-radius:14px;background:var(--card2);font-weight:700;cursor:pointer}
.btn.pri{background:var(--pri);color:#fff}
.opgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.opgrid button{height:64px;border:1px solid var(--line);border-radius:14px;background:var(--card2);font-size:30px;font-weight:700;cursor:pointer}
.opgrid button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.sec{color:var(--mute);font-size:13px;margin:14px 0 8px}
.size{font-size:26px;font-weight:800;text-align:center;margin:4px 0 10px}
.size small{display:block;font-size:13px;color:var(--mute);font-weight:400}
.presets{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.presets button{flex:none;border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:7px 14px;font-weight:700;cursor:pointer}
.presets button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.steps{display:flex;gap:10px}
.step{flex:1;display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:14px;padding:4px}
.step span{font-size:14px;color:var(--mute);padding-left:8px}.step b{font-size:20px;min-width:30px;text-align:center}
.step button{width:42px;height:42px;border:0;border-radius:10px;background:var(--card2);font-size:22px;font-weight:700;cursor:pointer}
.picker{display:grid;gap:4px;touch-action:none;user-select:none;-webkit-user-select:none;margin:0 auto;width:max-content}
.picker i{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:var(--card2);display:block}
.picker i.on{background:var(--pri);border-color:var(--pri2)}

#viewer{position:fixed;inset:0;z-index:30;background:#000;display:none;flex-direction:column}
#viewer.on{display:flex}
#viewer img{flex:1;min-height:0;object-fit:contain;width:100%}
#viewer .vb{display:flex;gap:8px;padding:12px 12px calc(12px + env(safe-area-inset-bottom))}
#viewer .vb button{flex:1;height:50px;border:0;border-radius:14px;background:#1e293b;color:#fff;font-weight:700;cursor:pointer}
#viewer .vt{color:#cbd5e1;padding:calc(10px + env(safe-area-inset-top)) 14px 8px;font-size:15px}

#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#0f172a;color:#fff;border:1px solid #334155;border-radius:999px;padding:9px 10px 9px 18px;display:flex;align-items:center;gap:10px;font-size:15px;opacity:0;pointer-events:none;transition:.2s;z-index:40;white-space:nowrap}
#toast.on{opacity:.97;pointer-events:auto}
#toast button{border:0;background:var(--pri);color:#fff;border-radius:999px;padding:6px 12px;font-weight:700;cursor:pointer}
#toast button:empty{display:none}
</style>
</head>
<body>
<div id="wrap">
  <header>
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="M3.5 9.5h17M3.5 14.5h17M9.5 3.5v17M14.5 3.5v17"/></svg></div>
    <button id="listBtn"><b>EZGrid ตารางคิดเลข</b><span id="listName"></span></button>
    <button class="ib" id="shareB" title="แชร์ผล"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/><path d="M16 6l-4-4-4 4M12 2v14"/></svg></button>
    <button class="ib" id="menuB" title="เมนู"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button>
  </header>
  <main>
    <p class="hint">กรอกตัวเลขในช่อง · แตะปุ่มสีฟ้าหน้าแถวเพื่อเลือก + − × ÷ ของแถวนั้น · ผลอยู่ขวาสุด</p>
    <div id="tw"></div>
  </main>
</div>
<div class="total"><div><small id="totalLbl">รวมผลทุกแถว</small><b id="total">0</b></div><button id="addRow">＋ แถว</button><button id="sizeB" class="pri"></button></div>
<div id="bd"></div><div id="sheet"></div>
<div id="viewer"><div class="vt" id="vTitle"></div><img id="vImg" alt=""><div class="vb"><button id="vRetake">ถ่ายใหม่</button><button id="vDel">ลบรูป</button><button id="vClose">ปิด</button></div></div>
<div id="toast"><span id="tMsg"></span><button id="tAct"></button></div>
<input type="file" id="camIn" accept="image/*" capture="environment" hidden>
<input type="file" id="galIn" accept="image/*" hidden>
<script>
const KEY = 'ezcalc_v2', OLD_KEY = 'ezcalc_v1';
const OPS = {'+': '+', '-': '−', '*': '×', '/': '÷'};
const MAX_R = 200, MAX_C = 12, PICK_R = 10, PICK_C = 8;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const colName = i => String.fromCharCode(65 + i);
const CAM = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></svg>';

// ---------- data: list = {id, name, cols, rows: [{id, op, v: [..cols], photo}]} ----------
const newRow = (cols, op) => ({id: uid(), op: op || '+', v: Array(cols).fill(''), photo: false});
const newList = (name, r = 3, c = 3) => ({id: uid(), name, cols: c, rows: Array.from({length: r}, () => newRow(c))});
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.lists && s.lists.length) return s; } catch (e) {}
  try { // bring over the lines of the previous version (2 numbers per line)
    const o = JSON.parse(localStorage.getItem(OLD_KEY));
    if (o && o.lists && o.lists.some(l => l.lines.some(x => x.a || x.b))) return {cur: o.cur || 0, lists: o.lists.map(l => ({id: l.id, name: l.name, cols: 2, rows: l.lines.map(x => ({id: x.id, op: x.op, v: [x.a, x.b], photo: x.photo}))}))};
  } catch (e) {}
  return {lists: [newList('ชุดที่ 1')], cur: 0, fresh: true};
}
let S = load();
const L = () => S.lists[S.cur] || S.lists[0];
const save = () => { delete S.fresh; localStorage.setItem(KEY, JSON.stringify(S)); };

const num = s => { s = String(s ?? '').replace(/[,\s]/g, ''); if (s === '' || s === '.' || s === '-') return null; const v = Number(s); return isFinite(v) ? v : NaN; };
function rowResult(row, cols) {
  const vals = row.v.slice(0, cols).map(num).filter(v => v !== null);
  if (!vals.length) return null;
  if (vals.some(Number.isNaN)) return NaN;
  let x = vals[0];
  for (const v of vals.slice(1)) {
    if (row.op === '/' && v === 0) return Infinity;
    x = {'+': x + v, '-': x - v, '*': x * v, '/': x / v}[row.op];
  }
  return Math.round(x * 1e10) / 1e10;
}
const fmt = v => (Object.is(v, -0) ? 0 : v).toLocaleString('en-US', {maximumFractionDigits: 4});
const resText = v => v === null ? ['empty', '—'] : Number.isNaN(v) ? ['err', 'ตัวเลขผิด'] : !isFinite(v) ? ['err', 'หาร 0 ไม่ได้'] : ['', fmt(v)];
const rowExpr = (row, cols) => row.v.slice(0, cols).filter(x => num(x) !== null).join(` ${OPS[row.op]} `);

// ---------- photos (IndexedDB) ----------
const idb = new Promise((res, rej) => { const r = indexedDB.open('ezcalc', 1); r.onupgradeneeded = () => r.result.createObjectStore('photos'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const tx = async (mode, fn) => { const db = await idb; return new Promise((res, rej) => { const t = db.transaction('photos', mode), q = fn(t.objectStore('photos')); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); }); };
const pGet = k => tx('readonly', s => s.get(k)).catch(() => null);
const pPut = (k, v) => tx('readwrite', s => s.put(v, k));
const pDel = k => tx('readwrite', s => s.delete(k)).catch(() => {});
const urls = new Map();
async function photoUrl(id) {
  if (urls.has(id)) return urls.get(id);
  const b = await pGet(id); if (!b) return null;
  const u = URL.createObjectURL(b); urls.set(id, u); return u;
}
function dropPhoto(row) { if (!row.photo) return; pDel(row.id); if (urls.has(row.id)) { URL.revokeObjectURL(urls.get(row.id)); urls.delete(row.id); } }
async function shrink(file) {
  const src = URL.createObjectURL(file), img = new Image();
  img.src = src; await img.decode(); URL.revokeObjectURL(src);
  const k = Math.min(1, 1400 / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement('canvas');
  c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(r, 'image/jpeg', 0.75));
}

// ---------- render ----------
function resCell(row, cols) {
  const [cls, txt] = resText(rowResult(row, cols));
  return [cls + (txt.length > 9 && !cls ? ' long' : ''), cls ? txt : '= ' + txt];
}
function render() {
  const ls = L(), C = ls.cols;
  $('#listName').textContent = ls.name + ' ⌄';
  $('#sizeB').textContent = `ตาราง ${ls.rows.length}×${C}`;
  let h = '<table><thead><tr><th class="rn">#</th><th class="opc">คิด</th>';
  for (let c = 0; c < C; c++) h += `<th>${colName(c)}</th>`;
  h += '<th class="rc" style="color:var(--mute);font-weight:600;font-size:12.5px;text-align:right">ผล</th><th class="pc"></th></tr></thead><tbody>';
  ls.rows.forEach((row, r) => {
    const [cls, txt] = resCell(row, C);
    h += `<tr data-r="${r}"><td class="rn">${r + 1}</td><td class="opc"><button class="opb">${OPS[row.op]}</button></td>`;
    for (let c = 0; c < C; c++) h += `<td class="cl"><input data-c="${c}" value="${esc(row.v[c])}" inputmode="decimal" enterkeyhint="next" autocomplete="off" placeholder="0"></td>`;
    h += `<td class="rc ${cls}">${esc(txt)}</td><td class="pc"><button class="ph ${row.photo ? 'has' : ''}" title="ถ่ายรูป">${CAM}</button></td></tr>`;
  });
  $('#tw').innerHTML = h + '</tbody></table>';
  ls.rows.forEach(row => row.photo && showThumb(row));
  total();
}
async function showThumb(row) {
  const u = await photoUrl(row.id), i = L().rows.indexOf(row), btn = $(`tr[data-r="${i}"] .ph`);
  if (btn) btn.innerHTML = u ? `<img src="${u}" alt="">` : CAM;
}
function updateRow(r) {
  const td = $(`tr[data-r="${r}"] .rc`); if (!td) return;
  const [cls, txt] = resCell(L().rows[r], L().cols);
  td.className = 'rc ' + cls; td.textContent = txt;
  total();
}
function total() {
  const ls = L(), rs = ls.rows.map(row => rowResult(row, ls.cols)).filter(v => v !== null && isFinite(v));
  $('#total').textContent = fmt(rs.reduce((a, b) => a + b, 0));
  $('#totalLbl').textContent = `รวมผลทุกแถว · ${rs.length} แถว`;
}

// ---------- table events ----------
const tw = $('#tw');
tw.addEventListener('input', e => {
  const tr = e.target.closest('tr'); if (!tr || e.target.dataset.c === undefined) return;
  const r = +tr.dataset.r; L().rows[r].v[+e.target.dataset.c] = e.target.value;
  save(); updateRow(r);
});
tw.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.target.dataset.c === undefined) return;
  e.preventDefault();
  const r = +e.target.closest('tr').dataset.r, c = +e.target.dataset.c;
  if (c + 1 < L().cols) return focusCell(r, c + 1);
  if (r + 1 >= L().rows.length) addRow();
  focusCell(r + 1, 0);
});
function focusCell(r, c) { const i = $(`tr[data-r="${r}"] input[data-c="${c}"]`); if (i) { i.focus(); i.select(); } }
tw.addEventListener('click', e => {
  const tr = e.target.closest('tbody tr'); if (!tr) return;
  const r = +tr.dataset.r, row = L().rows[r];
  if (e.target.closest('.opb')) return opSheet(r);
  if (e.target.closest('.ph')) return row.photo ? openViewer(row) : pickPhoto(row);
  if (e.target.closest('.rn')) return rowSheet(r);
});
function addRow(silent) {
  const ls = L(); if (ls.rows.length >= MAX_R) return toast('ได้สูงสุด ' + MAX_R + ' แถว');
  ls.rows.push(newRow(ls.cols, ls.rows.at(-1)?.op)); save(); render();
  if (!silent) { const r = ls.rows.length - 1; $(`tr[data-r="${r}"]`).scrollIntoView({block: 'center', behavior: 'smooth'}); focusCell(r, 0); }
}
$('#addRow').onclick = () => addRow();

// ---------- sheets ----------
function sheet(html) { $('#sheet').innerHTML = '<div class="grab"></div>' + html; $('#sheet').classList.add('on'); $('#bd').classList.add('on'); }
function closeSheet() { $('#sheet').classList.remove('on'); $('#bd').classList.remove('on'); }
$('#bd').onclick = closeSheet;
let sheetRow = -1;
function opSheet(r) {
  sheetRow = r;
  const row = L().rows[r], ex = rowExpr(row, L().cols);
  sheet(`<h3>แถว ${r + 1}: เลือกเครื่องหมาย</h3>
    <div class="opgrid">${Object.entries(OPS).map(([k, s]) => `<button data-setop="${k}" class="${row.op === k ? 'on' : ''}">${s}</button>`).join('')}</div>
    <div class="sec">ใช้กับทุกแถว</div>
    <div class="opgrid">${Object.entries(OPS).map(([k, s]) => `<button data-setall="${k}" style="height:48px;font-size:22px">${s}</button>`).join('')}</div>
    ${ex ? `<div class="sec">ตอนนี้: ${esc(ex)} ${esc(resCell(row, L().cols)[1])}</div>` : ''}`);
}
function rowSheet(r) {
  sheetRow = r;
  sheet(`<h3>แถว ${r + 1}</h3>
    <button class="mi" data-a="insBelow">แทรกแถวใหม่ด้านล่าง</button>
    <button class="mi" data-a="clearRow">ล้างตัวเลขในแถวนี้</button>
    <button class="mi bad" data-a="delRow">ลบแถวนี้</button>`);
}
let tmpR = 3, tmpC = 3;
function sizeSheet(first) {
  tmpR = L().rows.length; tmpC = L().cols;
  const draw = () => {
    let g = '';
    for (let r = 0; r < PICK_R; r++) for (let c = 0; c < PICK_C; c++) g += `<i data-pr="${r}" data-pc="${c}" class="${r < tmpR && c < tmpC ? 'on' : ''}"></i>`;
    sheet(`<h3>${first ? 'เลือกขนาดตาราง' : 'ขนาดตาราง'}</h3>
      <div class="size">${tmpR} แถว × ${tmpC} คอลัมน์<small>แตะหรือลากบนตารางด้านล่าง หรือกด − / +</small></div>
      <div class="presets">${[1, 2, 3, 4, 5, 6].map(n => `<button data-pre="${n}" class="${tmpR === n && tmpC === n ? 'on' : ''}">${n}×${n}</button>`).join('')}<button data-pre2="10,2">10×2</button><button data-pre2="10,3">10×3</button></div>
      <div class="sec"></div>
      <div class="picker" id="picker" style="grid-template-columns:repeat(${PICK_C},26px)">${g}</div>
      <div class="sec"></div>
      <div class="steps">
        <div class="step"><span>แถว</span><button data-st="r,-1">−</button><b>${tmpR}</b><button data-st="r,1">+</button></div>
        <div class="step"><span>คอลัมน์</span><button data-st="c,-1">−</button><b>${tmpC}</b><button data-st="c,1">+</button></div>
      </div>
      <div class="btns">${first ? '' : '<button class="btn" data-a="close">ยกเลิก</button>'}<button class="btn pri" data-a="applySize">ใช้ขนาดนี้</button></div>`);
    const pk = $('#picker');
    const at = e => { const el = document.elementFromPoint(e.clientX, e.clientY); return el && el.dataset.pr !== undefined ? el : null; };
    const pickTo = el => { if (!el) return; tmpR = +el.dataset.pr + 1; tmpC = +el.dataset.pc + 1; pk.querySelectorAll('i').forEach(i => i.classList.toggle('on', +i.dataset.pr < tmpR && +i.dataset.pc < tmpC)); $('#sheet .size').firstChild.textContent = `${tmpR} แถว × ${tmpC} คอลัมน์`; $('#sheet .steps').querySelectorAll('b')[0].textContent = tmpR; $('#sheet .steps').querySelectorAll('b')[1].textContent = tmpC; };
    let down = false;
    pk.onpointerdown = e => { down = true; pk.setPointerCapture(e.pointerId); pickTo(at(e)); };
    pk.onpointermove = e => { if (down) pickTo(at(e)); };
    pk.onpointerup = pk.onpointercancel = () => { down = false; };
    $('#sheet').querySelectorAll('[data-pre]').forEach(b => b.onclick = () => { tmpR = tmpC = +b.dataset.pre; draw(); });
    $('#sheet').querySelectorAll('[data-pre2]').forEach(b => b.onclick = () => { [tmpR, tmpC] = b.dataset.pre2.split(',').map(Number); draw(); });
    $('#sheet').querySelectorAll('[data-st]').forEach(b => b.onclick = () => {
      const [k, d] = b.dataset.st.split(','); if (k === 'r') tmpR = Math.max(1, Math.min(MAX_R, tmpR + +d)); else tmpC = Math.max(1, Math.min(MAX_C, tmpC + +d)); draw();
    });
  };
  draw();
}
function applySize() {
  const ls = L(), lostRows = ls.rows.slice(tmpR), lostCells = ls.rows.slice(0, tmpR).some(row => row.v.slice(tmpC).some(x => x !== ''));
  if ((lostRows.some(row => row.v.some(x => x !== '') || row.photo) || lostCells) && !confirm('ข้อมูลในแถว/คอลัมน์ที่ตัดออกจะหาย ทำต่อไหม?')) return;
  lostRows.forEach(dropPhoto);
  ls.rows = ls.rows.slice(0, tmpR);
  while (ls.rows.length < tmpR) ls.rows.push(newRow(tmpC, ls.rows.at(-1)?.op));
  ls.rows.forEach(row => { row.v = row.v.slice(0, tmpC); while (row.v.length < tmpC) row.v.push(''); });
  ls.cols = tmpC; save(); closeSheet(); render();
  toast(`ตาราง ${tmpR}×${tmpC}`);
}
$('#sizeB').onclick = () => sizeSheet(false);

const listTotal = ls => fmt(ls.rows.map(row => rowResult(row, ls.cols)).filter(v => v !== null && isFinite(v)).reduce((a, b) => a + b, 0));
function listsSheet() {
  sheet(`<h3>ชุดคำนวณ</h3>` + S.lists.map((ls, i) => `<button class="mi ${i === S.cur ? 'on' : ''}" data-list="${i}">${i === S.cur ? '● ' : ''}${esc(ls.name)}<small>${ls.rows.length}×${ls.cols} · รวม ${listTotal(ls)}</small></button>`).join('') +
    `<div class="btns"><button class="btn pri" data-a="newList">＋ ชุดใหม่</button><button class="btn" data-a="rename">เปลี่ยนชื่อ</button></div>`);
}
$('#listBtn').onclick = listsSheet;
$('#menuB').onclick = () => sheet(`<h3>เมนู</h3>
  <button class="mi" data-a="size">ขนาดตาราง<small>${L().rows.length}×${L().cols}</small></button>
  <button class="mi" data-a="lists">ชุดคำนวณทั้งหมด<small>${S.lists.length} ชุด</small></button>
  <button class="mi" data-a="share">แชร์ / คัดลอกผล</button>
  ${installEv ? '<button class="mi" data-a="install">ติดตั้งลงมือถือ</button>' : ''}
  <button class="mi bad" data-a="clear">ล้างตัวเลขทั้งตาราง</button>
  <button class="mi bad" data-a="delList">ลบชุดนี้</button>`);
$('#sheet').onclick = e => {
  const b = e.target.closest('[data-a],[data-list],[data-setop],[data-setall]'); if (!b) return;
  const ls = L();
  if (b.dataset.setop) { ls.rows[sheetRow].op = b.dataset.setop; save(); closeSheet(); render(); return; }
  if (b.dataset.setall) { ls.rows.forEach(row => row.op = b.dataset.setall); save(); closeSheet(); render(); return toast('ทุกแถวใช้ ' + OPS[b.dataset.setall]); }
  if (b.dataset.list) { S.cur = +b.dataset.list; save(); closeSheet(); render(); scrollTo(0, 0); return; }
  switch (b.dataset.a) {
    case 'close': return closeSheet();
    case 'applySize': return applySize();
    case 'size': return sizeSheet(false);
    case 'cam': return $('#camIn').click();
    case 'gal': return $('#galIn').click();
    case 'lists': return listsSheet();
    case 'share': closeSheet(); return share();
    case 'install': closeSheet(); installEv.prompt(); installEv.userChoice.finally(() => installEv = null); return;
    case 'newList': S.lists.push(newList('ชุดที่ ' + (S.lists.length + 1))); S.cur = S.lists.length - 1; save(); render(); return sizeSheet(true);
    case 'rename': { const n = prompt('ชื่อชุดคำนวณ', ls.name); if (n && n.trim()) { ls.name = n.trim(); save(); render(); } return listsSheet(); }
    case 'insBelow': ls.rows.splice(sheetRow + 1, 0, newRow(ls.cols, ls.rows[sheetRow].op)); save(); closeSheet(); render(); return focusCell(sheetRow + 1, 0);
    case 'clearRow': ls.rows[sheetRow].v = Array(ls.cols).fill(''); save(); closeSheet(); render(); return;
    case 'delRow': {
      const i = sheetRow, row = ls.rows.splice(i, 1)[0];
      if (!ls.rows.length) ls.rows.push(newRow(ls.cols, row.op));
      save(); closeSheet(); render();
      let undone = false;
      toast('ลบแถวแล้ว', 'เลิกทำ', () => { undone = true; ls.rows.splice(i, 0, row); save(); render(); });
      setTimeout(() => { if (!undone) dropPhoto(row); }, 6000);
      return;
    }
    case 'clear':
      if (!confirm('ล้างตัวเลขทุกช่องในตารางนี้?')) return;
      ls.rows.forEach(row => { row.v = Array(ls.cols).fill(''); dropPhoto(row); row.photo = false; });
      save(); closeSheet(); render(); return;
    case 'delList':
      if (!confirm(`ลบชุด "${ls.name}" ทั้งหมด?`)) return;
      ls.rows.forEach(dropPhoto); S.lists.splice(S.cur, 1);
      if (!S.lists.length) S.lists.push(newList('ชุดที่ 1'));
      S.cur = Math.max(0, S.cur - 1); save(); closeSheet(); render(); return;
  }
};

// ---------- photo per row ----------
let photoFor = null;
function pickPhoto(row) {
  photoFor = row;
  sheet(`<h3>รูปของแถว ${L().rows.indexOf(row) + 1}</h3>
    <button class="mi" data-a="cam">${CAM} ถ่ายรูป</button>
    <button class="mi" data-a="gal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 17l-5-5-9 8"/></svg> เลือกจากคลังภาพ</button>`);
}
async function gotFile(e) {
  const f = e.target.files[0]; e.target.value = '';
  const row = photoFor; if (!f || !row) return;
  closeSheet();
  try {
    const blob = await shrink(f);
    await pPut(row.id, blob);
    if (urls.has(row.id)) { URL.revokeObjectURL(urls.get(row.id)); urls.delete(row.id); }
    row.photo = true; save();
    $(`tr[data-r="${L().rows.indexOf(row)}"] .ph`)?.classList.add('has'); showThumb(row);
    toast('แนบรูปแล้ว');
    if ($('#viewer').classList.contains('on')) openViewer(row);
  } catch (err) { toast('บันทึกรูปไม่ได้'); }
}
$('#camIn').onchange = gotFile;
$('#galIn').onchange = gotFile;
let viewing = null;
async function openViewer(row) {
  viewing = row;
  const ex = rowExpr(row, L().cols);
  $('#vTitle').textContent = `แถว ${L().rows.indexOf(row) + 1}${ex ? ' · ' + ex + ' ' + resCell(row, L().cols)[1] : ''}`;
  $('#vImg').src = await photoUrl(row.id) || '';
  $('#viewer').classList.add('on');
}
$('#vClose').onclick = () => $('#viewer').classList.remove('on');
$('#vRetake').onclick = () => { photoFor = viewing; $('#camIn').click(); };
$('#vDel').onclick = () => {
  if (!viewing || !confirm('ลบรูปนี้?')) return;
  dropPhoto(viewing); viewing.photo = false; save(); $('#viewer').classList.remove('on'); render(); toast('ลบรูปแล้ว');
};

// ---------- share ----------
async function share() {
  const ls = L();
  const rows = ls.rows.map((row, i) => { const v = rowResult(row, ls.cols); return v === null ? null : `${i + 1}) ${rowExpr(row, ls.cols)} = ${resText(v)[1]}`; }).filter(Boolean);
  const text = `${ls.name}\n${rows.join('\n')}\nรวมผลทุกแถว = ${$('#total').textContent}`;
  try { if (navigator.share) return await navigator.share({title: ls.name, text}); } catch (e) { if (e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(text); toast('คัดลอกผลแล้ว'); } catch (e) { prompt('คัดลอกข้อความนี้', text); }
}
$('#shareB').onclick = share;

let tTimer;
function toast(msg, act, fn) {
  $('#tMsg').textContent = msg; $('#tAct').textContent = act || '';
  $('#tAct').onclick = () => { $('#toast').classList.remove('on'); fn && fn(); };
  $('#toast').classList.add('on'); clearTimeout(tTimer); tTimer = setTimeout(() => $('#toast').classList.remove('on'), act ? 5000 : 1800);
}

// ---------- install (Android: menu > ติดตั้งลงมือถือ; iPhone: Safari share > เพิ่มไปยังหน้าจอโฮม) ----------
let installEv = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEv = e; });
addEventListener('appinstalled', () => { installEv = null; toast('ติดตั้งแล้ว'); });
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});

const first = !!S.fresh;
render();
if (first) sizeSheet(true);
</script>
</body>
</html>
