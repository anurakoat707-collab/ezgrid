<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0b1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EZGrid">
<title>EZGrid Mobile - ตารางกรอกข้อมูลบนมือถือ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0b1220;--app:#0d1526;--bar:#0f1a2e;--cell:#0c1424;--grid:#1d2a44;--hd:#111c31;--hdtx:#6f8fbf;--hl:#16294a;--tx:#e2e8f0;--mute:#8193b2;--pri:#2563eb;--pri2:#60a5fa;--sel:rgba(59,130,246,.20);--ok:#22c55e;--chip:#13203a;--line:#1f2d4a;--input:#0a1322}
body.light{--bg:#e8edf5;--app:#f6f8fc;--bar:#fff;--cell:#fff;--grid:#e1e7f0;--hd:#f1f4f9;--hdtx:#5b6b85;--hl:#dbe7fb;--tx:#0f172a;--mute:#64748b;--sel:rgba(37,99,235,.13);--chip:#eef2f8;--line:#e2e8f0;--input:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI","Noto Sans Thai",sans-serif}
button{font:inherit;color:inherit}
#frameBar{display:none}
#app{display:flex;flex-direction:column;height:100dvh;background:var(--app);position:relative;overflow:hidden}
body.framed{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;height:100vh;background:radial-gradient(circle at 30% 20%,#12243f,var(--bg) 60%)}
body.light.framed{background:radial-gradient(circle at 30% 20%,#fff,var(--bg) 60%)}
body.framed #app{width:390px;height:min(844px,calc(100vh - 64px));border-radius:34px;border:7px solid #1e293b;box-shadow:0 20px 60px rgba(0,0,0,.5)}
body.wide #frameBar{display:flex;gap:4px;background:#0f1a2e;border:1px solid #1f2d4a;border-radius:999px;padding:3px}
#frameBar button{border:0;background:none;color:#94a3b8;border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
#frameBar button.on{background:var(--pri);color:#fff}
body:not(.framed).wide #frameBar{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:50}
body:not(.framed).wide #app{padding-top:44px}

/* header */
header{display:flex;align-items:center;gap:6px;padding:10px 10px 8px;padding-top:max(10px,env(safe-area-inset-top));background:var(--bar);border-bottom:1px solid var(--line)}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#2563eb,#38bdf8);display:grid;place-items:center;flex:none}
.brand{flex:1;min-width:0;line-height:1.15}
.brand b{font-size:15px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-left:4px;vertical-align:middle}
.dot.busy{background:#f59e0b}
.brand button{display:block;border:0;background:none;padding:0;color:var(--pri2);font-size:12px;cursor:pointer;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb{border:1px solid var(--line);background:var(--chip);border-radius:10px;height:34px;min-width:34px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;font-size:12.5px}
.hb.on{background:var(--pri);border-color:var(--pri);color:#fff}
.hb svg{width:17px;height:17px}

/* grid */
#gw{flex:1;overflow:auto;background:var(--cell);scroll-padding:28px 0 0 40px;overscroll-behavior:contain;scrollbar-width:thin;user-select:none;-webkit-user-select:none;position:relative}
table{border-collapse:separate;border-spacing:0;table-layout:fixed}
th,td{height:34px;border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);padding:0 6px;white-space:nowrap;overflow:hidden;font-size:14px}
td{width:72px;min-width:72px;max-width:72px;background:var(--cell);color:var(--tx);cursor:cell}
thead th{position:sticky;top:0;z-index:2;background:var(--hd);color:var(--hdtx);font-weight:600;font-size:12px;height:28px;text-align:center;cursor:pointer}
tbody th{position:sticky;left:0;z-index:1;background:var(--hd);color:var(--mute);width:40px;min-width:40px;max-width:40px;font-weight:500;font-size:12px;text-align:center;cursor:pointer}
thead th.corner{left:0;z-index:3;width:40px;min-width:40px}
th.hl{background:var(--hl);color:var(--pri2)}
td.n{text-align:right}td.err{color:#f87171}
td.sel{background-image:linear-gradient(var(--sel),var(--sel))}
td.act{box-shadow:inset 0 0 0 2px var(--pri2)}
td.ref{box-shadow:inset 0 0 0 2px #22c55e}
td.act.ref{box-shadow:inset 0 0 0 2px var(--pri2),inset 0 0 0 4px #22c55e}

/* bottom area */
#status{padding:4px 10px;font-size:12.5px;color:var(--mute);background:var(--bar);border-top:1px solid var(--line);white-space:nowrap;overflow-x:auto;min-height:24px;display:none}
#status.on{display:block}#status b{color:var(--tx);font-weight:600}#status .pv{color:var(--ok);font-weight:700}
#ops{display:none;padding:7px 10px 3px;background:var(--bar);border-top:1px solid var(--line)}
#ops.on{display:block}
#ops .lb{font-size:12.5px;color:var(--mute);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#ops .lb b{color:var(--tx);font-size:14px}
#ops .ob{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
#ops button{border:1px solid var(--line);background:var(--chip);border-radius:12px;padding:4px 2px 5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.15;min-width:0}
#ops button span{font-size:22px;font-weight:700;color:var(--pri2)}
#ops button.sum span{color:var(--ok)}
#ops button small{font-size:12px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#ops button:active{background:var(--pri);color:#fff}
.fbar{display:flex;gap:6px;align-items:center;padding:8px 10px 6px;background:var(--bar);border-top:1px solid var(--line)}
#addr{flex:none;min-width:46px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--pri2);font-weight:700;font-size:12.5px;cursor:pointer;padding:0 6px}
#inp{flex:1;min-width:0;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--input);color:var(--tx);padding:0 10px;font-size:16px;outline:none}
#inp:focus{border-color:var(--pri2)}
#okb{flex:none;height:38px;border:0;border-radius:10px;background:var(--pri);color:#fff;font-weight:700;padding:0 12px;cursor:pointer;display:flex;align-items:center;gap:4px}
.nav{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.nav button{border:0;background:var(--chip);width:30px;height:36px;cursor:pointer;font-size:15px}
.nav button.dn{background:#1d4ed8;color:#fff}
body.light .nav button.dn{background:#dbeafe;color:#1d4ed8}
#chips{display:flex;gap:6px;overflow-x:auto;padding:4px 10px 8px;background:var(--bar);scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.ch{flex:none;border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;font-weight:600}
.ch.blue{background:var(--pri);border-color:var(--pri);color:#fff}
.ch.teal{border-color:#0f766e;color:#2dd4bf}.ch.green{border-color:#15803d;color:#4ade80}.ch.amber{border-color:#b45309;color:#fbbf24}
body.light .ch.teal{color:#0f766e}body.light .ch.green{color:#15803d}body.light .ch.amber{color:#b45309}
.ch.op{min-width:40px;font-size:16px;padding:4px 10px}
.ch.on{background:var(--pri);color:#fff;border-color:var(--pri)}
nav.tabs{display:flex;background:var(--bar);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;padding:7px 0 8px;font-size:11.5px;color:var(--mute);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:21px;height:21px}
nav.tabs button.on{color:var(--pri2)}

/* panel */
#panel{position:absolute;left:0;right:0;bottom:var(--tabsh,58px);max-height:62%;overflow-y:auto;background:var(--bar);border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.35);padding:10px 14px 14px;transform:translateY(110%);transition:transform .2s,visibility .2s;visibility:hidden;z-index:20}
#panel.on{transform:none;visibility:visible}
#panel h3{margin:0 0 8px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
#panel h3 button{border:0;background:var(--chip);border-radius:8px;width:30px;height:28px;cursor:pointer}
.sec{font-size:12px;color:var(--mute);margin:12px 0 6px}
.bg{display:flex;flex-wrap:wrap;gap:6px}
.pb{border:1px solid var(--line);background:var(--chip);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:13.5px}
.pb.on{background:var(--pri);border-color:var(--pri);color:#fff}
.pb.bad{color:#f87171}
.sw{width:32px;height:32px;border-radius:9px;border:2px solid var(--line);cursor:pointer;display:grid;place-items:center;font-size:12px;color:var(--mute)}
.sw.on{border-color:var(--pri2)}
.fx{display:flex;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.fx b{min-width:74px;color:var(--pri2);font-size:13.5px}
.fx div{flex:1;min-width:0}.fx small{display:block;color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shr{display:flex;align-items:center;gap:8px;padding:10px 6px;border-bottom:1px solid var(--line);cursor:pointer}
.shr.on{color:var(--pri2);font-weight:700}.shr span{flex:1}
.tip{font-size:12.5px;color:var(--mute);background:var(--chip);border-radius:10px;padding:8px 10px;margin-bottom:6px}
.help li{margin-bottom:6px;font-size:13.5px}
#toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:#111827;color:#fff;border:1px solid #334155;padding:8px 16px;border-radius:999px;font-size:13.5px;opacity:0;transition:.2s;pointer-events:none;z-index:40;white-space:nowrap}
#toast.on{opacity:.95}
</style>
</head>
<body>
<div id="frameBar"><button data-fr="1">จำลองจอมือถือ (390px)</button><button data-fr="0">เต็มจอ</button></div>
<div id="app">
  <header>
    <div class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg></div>
    <div class="brand"><b>EZGrid</b><span class="dot" id="dot"></span><button id="shName" title="เปลี่ยนชีต"></button></div>
    <button class="hb" id="undoB" title="ย้อนกลับ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
    <button class="hb" id="rangeB" title="เลือกช่วง"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="3 2"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>เลือกช่วง</button>
    <button class="hb" id="themeB" title="สลับธีม"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    <button class="hb" id="moreB" title="เมนู">⋮</button>
  </header>
  <div id="gw"></div>
  <div id="status"></div>
  <div id="ops"></div>
  <div class="fbar">
    <button id="addr" title="ไปที่ช่อง">A1</button>
    <input id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" placeholder="พิมพ์ตัวเลข หรือ =สูตร">
    <button id="okb" class="keep">✓ ตกลง</button>
    <div class="nav"><button class="keep" data-mv="0,-1">←</button><button class="keep" data-mv="0,1">→</button><button class="keep dn" data-mv="1,0">↓</button></div>
  </div>
  <div id="chips"></div>
  <nav class="tabs">
    <button data-p="fmt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 3l3 3-9 9-4 1 1-4z"/><path d="M8 16c-3 0-4 2-4 5 3 0 5-1 5-4"/></svg>จัดรูปแบบ</button>
    <button data-p="sheet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></svg>ชีต</button>
    <button data-p="file"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 10v6M9 13h6"/></svg>ไฟล์/เพิ่มช่อง</button>
  </nav>
  <div id="panel"></div>
  <div id="toast"></div>
  <input type="file" id="csvIn" accept=".csv,text/csv,text/plain" hidden>
</div>
<script>
const KEY = 'ezgrid_v1';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const colName = i => { let s = ''; i++; while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = (i - 1 - m) / 26; } return s; };
const colIdx = s => [...s.toUpperCase()].reduce((a, ch) => a * 26 + ch.charCodeAt(0) - 64, 0) - 1;
const A = (r, c) => colName(c) + (r + 1);
const parseA = s => { const m = /^\$?([A-Za-z]{1,3})\$?(\d+)$/.exec(String(s).trim()); return m ? {r: +m[2] - 1, c: colIdx(m[1])} : null; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const MAX_ROWS = 10000, MAX_COLS = 702; // grid grows while scrolling, up to row 10000 / column ZZ

// ---------- state ----------
function newSheet(name) { return {id: uid(), name, nr: 60, nc: 12, cells: {}}; }
function demoSheet() {
  const s = newSheet('ตัวอย่าง: คิดราคา');
  const d = {A1: 'รายการ', B1: 'จำนวน', C1: 'ราคา', D1: 'รวม',
    A2: 'สาย LAN', B2: '10', C2: '45', D2: '=B2*C2',
    A3: 'ถุงมือ ESD', B3: '5', C3: '120', D3: '=B3*C3',
    A4: 'พัดลม 80mm', B4: '4', C4: '150', D4: '=B4*C4',
    A5: 'รวมทั้งหมด', B5: '=SUM(B2:B4)', D5: '=SUM(D2:D4)',
    A7: 'เฉลี่ย/ชิ้น', D7: '=D5/B5'};
  for (const k in d) s.cells[k] = {v: d[k]};
  ['A1', 'B1', 'C1', 'D1', 'A5', 'B5', 'D5'].forEach(k => s.cells[k].s = {b: true});
  ['C2', 'C3', 'C4', 'D2', 'D3', 'D4', 'D5', 'D7'].forEach(k => s.cells[k].s = {...s.cells[k].s, nf: 'baht'});
  ['A1', 'B1', 'C1', 'D1'].forEach(k => s.cells[k].s.bg = '#bfdbfe');
  return s;
}
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.sheets && s.sheets.length) return s; } catch (e) {}
  return {sheets: [demoSheet(), newSheet('ตารางใหม่')], cur: 0, theme: 'dark', framed: true, numpad: false};
}
let S = load();
const sh = () => S.sheets[S.cur];
let sel = {ar: 0, ac: 0, er: 0, ec: 0}, rangeMode = false, dirty = false, pick = null, panel = null;
let undoS = [], redoS = [], clip = null, tds = [], drag = false, mouseDown = false, downPicked = false;
function save() { localStorage.setItem(KEY, JSON.stringify(S)); const d = $('#dot'); d.classList.add('busy'); clearTimeout(d._t); d._t = setTimeout(() => d.classList.remove('busy'), 300); }
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 1700); }

// ---------- formula engine ----------
class Err { constructor(code) { this.code = code; } }
const E = c => new Err(c);
let cache = new Map(), visiting = new Set();
const astCache = new Map();

function literal(raw) {
  if (raw === '' || raw == null) return null;
  const t = String(raw).replace(/,/g, '').trim();
  if (/^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?%?$/i.test(t)) return t.endsWith('%') ? parseFloat(t) / 100 : parseFloat(t);
  if (/^true$/i.test(t)) return true;
  if (/^false$/i.test(t)) return false;
  return String(raw);
}
function getVal(r, c) {
  if (r < 0 || c < 0) throw E('#REF!');
  const k = A(r, c);
  if (cache.has(k)) return cache.get(k);
  const raw = sh().cells[k]?.v ?? '';
  let v;
  if (raw[0] === '=' && raw.length > 1) {
    if (visiting.has(k)) return E('#CYCLE!');
    visiting.add(k); v = evalFormula(raw.slice(1)); visiting.delete(k);
  } else v = literal(raw);
  cache.set(k, v);
  return v;
}
function lex(s) {
  const re = /\s*(?:([A-Za-z_][A-Za-z0-9_.]*)(?=\s*\()|(\$?[A-Za-z]{1,3}\$?\d+(?::\$?[A-Za-z]{1,3}\$?\d+)?)(?![A-Za-z0-9_])|(\d+\.?\d*(?:[eE][-+]?\d+)?|\.\d+)|"((?:[^"]|"")*)"|(<>|<=|>=|[-+*/^&%=<>(),;])|(#REF!)|([A-Za-z_][A-Za-z0-9_]*))/y;
  const out = [];
  while (re.lastIndex < s.length) {
    const at = re.lastIndex, m = re.exec(s);
    if (!m) { if (/^\s*$/.test(s.slice(at))) break; throw E('#ERROR!'); }
    if (m[1]) out.push({t: 'fn', v: m[1].toUpperCase()});
    else if (m[2]) out.push({t: 'ref', v: m[2].toUpperCase().replace(/\$/g, '')});
    else if (m[3]) out.push({t: 'num', v: +m[3]});
    else if (m[4] !== undefined) out.push({t: 'str', v: m[4].replace(/""/g, '"')});
    else if (m[5]) out.push({t: 'op', v: m[5] === ';' ? ',' : m[5]});
    else if (m[6]) out.push({t: 'err'});
    else if (m[7]) out.push({t: 'id', v: m[7].toUpperCase()});
    else break;
  }
  return out;
}
function parse(src) {
  if (astCache.has(src)) return astCache.get(src);
  const T = lex(src); let i = 0;
  const isOp = (...vs) => T[i] && T[i].t === 'op' && vs.includes(T[i].v);
  const eat = v => isOp(v) ? (i++, true) : false;
  const bin = (next, ops) => () => { let a = next(); while (isOp(...ops)) { const o = T[i++].v; a = {k: 'op', o, a, b: next()}; } return a; };
  const una = () => {
    if (isOp('-')) { i++; return {k: 'neg', a: una()}; }
    if (isOp('+')) { i++; return {k: 'pos', a: una()}; }
    let v = prim();
    while (isOp('%')) { i++; v = {k: 'pct', a: v}; }
    return v;
  };
  const pow = bin(una, ['^']), mul = bin(pow, ['*', '/']), add = bin(mul, ['+', '-']), cat = bin(add, ['&']), cmp = bin(cat, ['=', '<>', '<', '>', '<=', '>=']);
  function prim() {
    const t = T[i++];
    if (!t) throw E('#ERROR!');
    if (t.t === 'num') return {k: 'v', v: t.v};
    if (t.t === 'str') return {k: 'v', v: t.v};
    if (t.t === 'err') return {k: 'e', v: '#REF!'};
    if (t.t === 'id') return t.v === 'TRUE' ? {k: 'v', v: true} : t.v === 'FALSE' ? {k: 'v', v: false} : {k: 'e', v: '#NAME?'};
    if (t.t === 'ref') return {k: 'ref', v: t.v};
    if (t.t === 'fn') {
      eat('(');
      const args = [];
      if (!isOp(')')) do { args.push(isOp(',', ')') ? null : cmp()); } while (eat(','));
      if (!eat(')')) throw E('#ERROR!');
      return {k: 'fn', n: t.v, args};
    }
    if (t.t === 'op' && t.v === '(') { const v = cmp(); if (!eat(')')) throw E('#ERROR!'); return v; }
    throw E('#ERROR!');
  }
  const ast = cmp();
  if (i < T.length) throw E('#ERROR!');
  astCache.set(src, ast);
  return ast;
}

});
gw.addEventListener('mousedown', e => { if (downPicked) e.preventDefault(); });
gw.addEventListener('pointermove', e => {
  if (!drag) return;
  const td = document.elementFromPoint(e.clientX, e.clientY)?.closest('td');
  if (td && (+td.dataset.r !== sel.er || +td.dataset.c !== sel.ec)) extendTo(+td.dataset.r, +td.dataset.c);
});
addEventListener('pointerup', () => drag = false);
gw.addEventListener('click', e => {
  const td = e.target.closest('td'), th = e.target.closest('th');
  if (downPicked) return;
  if (th) {
    const s = sh();
    if (th.dataset.hc !== undefined) { const c = +th.dataset.hc; selectCell(0, c); extendTo(s.nr - 1, c); gw.scrollTop = 0; }
    else if (th.dataset.hr !== undefined) { const r = +th.dataset.hr; selectCell(r, 0); extendTo(r, s.nc - 1); gw.scrollLeft = 0; }
    return;
  }
  if (!td || mouseDown) return;
  const r = +td.dataset.r, c = +td.dataset.c;
  if (rangeMode) return extendTo(r, c);
  if (r === sel.ar && c === sel.ac && !multi()) return startEdit();
  selectCell(r, c);
});
gw.addEventListener('dblclick', e => { if (e.target.closest('td') && !downPicked) startEdit(); });
document.addEventListener('pointerdown', e => { if (e.target.closest('.keep')) e.preventDefault(); });
document.addEventListener('mousedown', e => { if (e.target.closest('.keep')) e.preventDefault(); });

inp.addEventListener('input', () => { dirty = true; if (pick && inp.value !== pick.after) pick = null; paintRefs(); status(); chips(); });
inp.addEventListener('focus', () => { paintRefs(); status(); chips(); });
inp.addEventListener('blur', () => setTimeout(() => { paintRefs(); status(); chips(); }, 0));
$('#okb').onclick = () => { commit(); move(1, 0); };
document.querySelectorAll('[data-mv]').forEach(b => b.onclick = () => { const [dr, dc] = b.dataset.mv.split(',').map(Number); move(dr, dc); });
$('#addr').onclick = () => {
  const t = prompt('ไปที่ช่อง (เช่น B12 หรือ A1:C5)', rngText()); if (!t) return;
  const [a, b] = t.toUpperCase().split(':').map(parseA);
  if (!a) return toast('ตำแหน่งไม่ถูกต้อง');
  selectCell(a.r, a.c); if (b) extendTo(b.r, b.c);
};
$('#undoB').onclick = () => doUndo(false);
$('#rangeB').onclick = () => { rangeMode = !rangeMode; $('#rangeB').classList.toggle('on', rangeMode); if (!rangeMode && !fEdit()) { sel.er = sel.ar; sel.ec = sel.ac; paintSel(); } status(); toast(rangeMode ? 'เลือกช่วง: แตะช่องสุดท้าย' : 'ปิดโหมดเลือกช่วง'); };
$('#themeB').onclick = () => { S.theme = S.theme === 'light' ? 'dark' : 'light'; save(); applyTheme(); };
$('#moreB').onclick = () => openPanel('more');
$('#shName').onclick = () => openPanel('sheet');
function applyTheme() { document.body.classList.toggle('light', S.theme === 'light'); document.querySelector('meta[name=theme-color]').content = S.theme === 'light' ? '#ffffff' : '#0b1220'; }
function applyFrame() {
  const wide = innerWidth > 700;
  document.body.classList.toggle('wide', wide);
  document.body.classList.toggle('framed', wide && S.framed !== false);
  document.querySelectorAll('#frameBar button').forEach(b => b.classList.toggle('on', (b.dataset.fr === '1') === (S.framed !== false)));
  document.documentElement.style.setProperty('--tabsh', ($('nav.tabs').offsetHeight || 58) + 'px');
}
document.querySelectorAll('#frameBar button').forEach(b => b.onclick = () => { S.framed = b.dataset.fr === '1'; save(); applyFrame(); });
addEventListener('resize', () => { applyFrame(); fillView(); });

document.addEventListener('keydown', e => {
  const ctrl = e.ctrlKey || e.metaKey, k = e.key;
  if (e.target === inp) {
    if (k === 'Enter') { e.preventDefault(); commit(); move(1, 0); }
    else if (k === 'Tab') { e.preventDefault(); commit(); move(0, e.shiftKey ? -1 : 1); }
    else if (k === 'Escape') { dirty = false; loadInput(); inp.blur(); }
    return;
  }
  if (e.target.tagName === 'INPUT' || panel && k !== 'Escape') return;
  if (k === 'Escape') return closePanel();
  if (ctrl) {
    const m = {z: () => doUndo(false), y: () => doUndo(true), c: () => doCopy(false), x: () => doCopy(true), v: () => doPaste(), a: () => { selectCell(0, 0); extendTo(sh().nr - 1, sh().nc - 1); }}[k.toLowerCase()];
    if (m) { e.preventDefault(); m(); }
    return;
  }
  const arrows = {ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1]}[k];
  if (arrows) { e.preventDefault(); return e.shiftKey ? extendTo(sel.er + arrows[0], sel.ec + arrows[1]) : move(...arrows); }
  if (k === 'Enter') { e.preventDefault(); return move(1, 0); }
  if (k === 'Tab') { e.preventDefault(); return move(0, e.shiftKey ? -1 : 1); }
  if (k === 'F2') { e.preventDefault(); return startEdit(); }
  if (k === 'Delete' || k === 'Backspace') { e.preventDefault(); return clearSel(); }
  if (k.length === 1 && !e.altKey) { e.preventDefault(); inp.focus(); inp.value = k; dirty = true; pick = null; paintRefs(); status(); chips(); }
});

// installable app (Android Chrome: menu ⋮ > ติดตั้งลงมือถือ, works offline after the first visit)
let installEv = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEv = e; });
addEventListener('appinstalled', () => { installEv = null; toast('ติดตั้งแล้ว เปิดจากไอคอน EZGrid ได้เลย'); });
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
if (matchMedia('(display-mode: standalone)').matches) S.framed = false;

applyTheme(); applyFrame(); applyNumpad(); buildGrid(); loadInput(); chips();
</script>
</body>
</html>
